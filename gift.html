html,body{margin:0;height:100%;overflow:hidden;background:#2a1a2e;font-family:Cairo,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline:12px;display:flex;justify-content:space-between;pointer-events:none}

#tm{font-size:22px;line-height:1;padding:6px 12px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translateX(-50%);max-width:88vw;background:rgba(60,25,45,.9);border:1px solid #d9a441;color:#ffe9f0;padding:10px 18px;border-radius:16px;font-size:15px;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none}

#joy{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);display:none;touch-action:none}
#kn{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,200,220,.85);left:34px;top:34px}

#pn h2{margin:0 0 4px;font-size:24px;color:#b0436b}#pn p{margin:4px 0;font-size:15px;line-height:1.7}
#pn .m{background:#ffe6ee;border-radius:12px;padding:8px 12px;font-weight:500}#pn small{color:#8a6a78;font-size:12px}
#pn .r{display:flex;gap:10px;margin-top:8px}#pn button{flex:1;border:0;border-radius:16px;padding:10px;font-weight:700;background:#ff9fbe;color:#4d1730}#pn #bk{background:#f1d9e2}
#fd{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}#md{position:fixed;inset:0;background:rgba(40,15,30,.55);display:none;align-items:center;justify-content:center;z-index:5}#mb{background:linear-gradient(#fff9fb,#ffeef4);border:2px solid #d9a441;box-shadow:0 10px 50px #0008;color:#5a2a40;border-radius:22px;padding:18px;width:min(520px,92vw);max-height:80vh;overflow:auto;box-sizing:border-box;line-height:1.8;text-align:center}#mb h3{margin:0 0 8px;color:#b0436b}#mb button{border:0;border-radius:14px;padding:9px 16px;margin:4px;font-weight:700;background:#ff9fbe;color:#4d1730}#mb button.cl{background:#f1d9e2;display:block;margin:10px auto 0}#mb button:disabled{opacity:.5}#mb input,#mb textarea{width:80%;border:1px solid #e9b8c8;border-radius:10px;padding:8px;font:inherit}#mb .r{display:flex;justify-content:center;align-items:center;gap:8px}#mb .ltr{background:#ffe6ee;border-radius:14px;padding:14px;animation:fi .8s}#mb .env{font-size:80px;animation:bn .6s infinite alternate}#mb .ph{font-size:90px;background:linear-gradient(135deg,#ffd3e1,#e6d4ff);border-radius:16px;padding:20px;margin-bottom:6px}#mb .tg{display:inline-block;background:#ffe6ee;border-radius:12px;padding:2px 10px;margin:3px;font-size:14px}#mg button{font-size:28px;padding:10px 0;margin:0}@keyframes fi{from{opacity:0;transform:scale(.8)}}@keyframes bn{to{transform:translateY(-10px)}}
